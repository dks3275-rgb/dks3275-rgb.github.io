<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AU 자료실</title>
<script src="device-check.js" data-auto-block></script>
<script src="dark-mode.js"></script>
<meta name="theme-color" content="#FFFFFF" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  /* 토스 디자인 토큰 */
  :root {
    --tk-bg: #F2F4F6; --tk-surface: #FFFFFF; --tk-surface-alt: #F9FAFB;
    --tk-text: #191F28; --tk-text-sub: #4E5968; --tk-text-muted: #8B95A1;
    --tk-border: #E5E8EB; --tk-border-strong: #D1D6DB;
    --tk-primary: #3182F6; --tk-primary-dark: #1B64DA; --tk-primary-soft: #E8F2FF;
    --tk-success: #00C896; --tk-warning: #FF9F1C; --tk-danger: #F04452;
    --tk-radius: 14px; --tk-radius-lg: 20px;
    --tk-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --tk-shadow: 0 2px 8px rgba(0,0,0,0.06);
    /* 카테고리 색상 (유지) */
    --cat-student: #3182F6; --cat-graduate: #FF9F1C; --cat-prospect: #00C896;
    --cat-company: #7C5CFA; --cat-community: #D85A30;
    /* 레거시 호환 */
    --navy: var(--tk-primary-dark); --blue: var(--tk-primary); --accent: var(--tk-warning);
    --light: var(--tk-bg); --gray: var(--tk-text-muted); --purple: var(--cat-company);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--tk-bg); min-height: 100vh; color: var(--tk-text); -webkit-font-smoothing: antialiased; letter-spacing: -0.2px; }
  .header { background: var(--tk-surface); padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--tk-border); }
  .home-btn { background: var(--tk-bg); color: var(--tk-text); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; transition: background 0.15s; font-weight: 600; }
  .home-btn:hover { background: var(--tk-border); }
  .home-btn:active { transform: scale(0.95); }
  .header-badge { background: var(--tk-primary-soft); color: var(--tk-primary); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; letter-spacing: -0.2px; }
  .header h1 { color: var(--tk-text); font-size: 16px; font-weight: 700; letter-spacing: -0.4px; }
  .retry-btn { margin-top: 16px; background: var(--tk-primary); color: white; border: none; border-radius: var(--tk-radius); padding: 12px 22px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: -0.3px; }
  .retry-btn:hover { background: var(--tk-primary-dark); }
  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px 40px; }
  .back-btn { display: none; align-items: center; gap: 8px; background: var(--tk-surface); border: 1px solid var(--tk-border); border-radius: var(--tk-radius); padding: 10px 16px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--tk-text-sub); margin-bottom: 16px; transition: all 0.15s; letter-spacing: -0.2px; }
  .back-btn:hover { background: var(--tk-bg); border-color: var(--tk-border-strong); color: var(--tk-text); }
  .back-btn.visible { display: flex; }
  .section-title { font-size: 17px; font-weight: 700; color: var(--tk-text); margin-bottom: 14px; letter-spacing: -0.4px; }
  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .category-card { background: var(--tk-surface); border-radius: var(--tk-radius-lg); padding: 24px 18px; cursor: pointer; transition: all 0.15s; border: 1px solid var(--tk-border); text-align: center; }
  .category-card:hover { border-color: var(--tk-border-strong); transform: translateY(-1px); box-shadow: var(--tk-shadow); }
  .category-card:active { transform: translateY(0); }
  .category-card.category-all { grid-column: 1 / -1; background: var(--tk-primary-soft); border-color: transparent; }
  .category-card.category-all:hover { background: #D6E8FF; border-color: transparent; }
  .category-card.category-all .category-name { color: var(--tk-primary); }
  .category-card.category-all .category-count { color: var(--tk-primary-dark); }
  .category-icon { font-size: 32px; margin-bottom: 10px; }
  .category-name { font-size: 14px; font-weight: 700; color: var(--tk-text); margin-bottom: 4px; letter-spacing: -0.3px; }
  .category-count { font-size: 11.5px; color: var(--tk-text-muted); }
  .file-list { display: flex; flex-direction: column; gap: 10px; }
  .resource-card { background: var(--tk-surface); border-radius: var(--tk-radius-lg); padding: 16px 18px; display: flex; align-items: center; gap: 14px; border: 1px solid var(--tk-border); transition: all 0.15s; }
  .resource-card:hover { border-color: var(--tk-border-strong); box-shadow: var(--tk-shadow); }
  .file-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; background: #FFE9E6; color: #C73E2D; }
  .file-icon.image { background: var(--tk-primary-soft); color: var(--tk-primary); }
  .file-icon.doc { background: #FFF4E0; color: #B26A00; }
  .card-info { flex: 1; min-width: 0; }
  .card-title { font-size: 14.5px; font-weight: 700; color: var(--tk-text); margin-bottom: 4px; letter-spacing: -0.3px; line-height: 1.35; }
  .card-desc { font-size: 12.5px; color: var(--tk-text-sub); margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: var(--tk-text-muted); }
  .card-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .btn-download { background: var(--tk-primary); color: white; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; text-decoration: none; text-align: center; white-space: nowrap; display: block; transition: background 0.15s; }
  .btn-download:hover { background: var(--tk-primary-dark); }
  .btn-view { background: var(--tk-primary-soft); color: var(--tk-primary); border: none; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; text-decoration: none; text-align: center; white-space: nowrap; display: block; transition: background 0.15s; }
  .btn-view:hover { background: #D6E8FF; }
  .empty { text-align: center; padding: 60px 20px; color: var(--tk-text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--tk-text-muted); }
  .target-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; margin-left: 4px; letter-spacing: -0.2px; }
  .target-badge.company { background: #EFE9FE; color: #5A3FCE; }
  .target-badge.student { background: var(--tk-primary-soft); color: var(--tk-primary); }
  .target-badge.shared { background: #FFF4E0; color: #B36500; }
  /* 검색 input */
  .resource-search-input { display: none; width: 100%; padding: 12px 14px; border: 1px solid var(--tk-border); border-radius: var(--tk-radius); font-size: 14px; margin-bottom: 12px; box-sizing: border-box; background: var(--tk-surface); outline: none; transition: all 0.15s; font-family: inherit; color: var(--tk-text); letter-spacing: -0.2px; }
  .resource-search-input:focus { border-color: var(--tk-primary); box-shadow: 0 0 0 3px rgba(49,130,246,0.1); }
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="home-btn" aria-label="홈으로">←</a>
  <div class="header-badge">자료실</div>
  <h1 id="pageTitle">AU 일학습병행 자료실</h1>
</div>
<div class="container">
  <button class="back-btn" id="backBtn" onclick="showCategories()">← 카테고리로 돌아가기</button>
  <div class="section-title" id="sectionTitle">카테고리 선택</div>
  <input type="text" id="resourceSearch" placeholder="🔍 자료명 검색..." class="resource-search-input" oninput="filterResources()">
  <div class="category-grid" id="categoryGrid"></div>
  <div class="file-list" id="fileList" style="display:none;"></div>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  const FB_CFG = { apiKey:"AIzaSyD6r6R593RIfe8GCMjM3lgQgCcfiF0Rbuc", authDomain:"au-ilhaksub.firebaseapp.com", projectId:"au-ilhaksub", storageBucket:"au-ilhaksub.firebasestorage.app", messagingSenderId:"407960160823", appId:"1:407960160823:web:1e830d6b0d69e4a7b84db2" };
  const app = initializeApp(FB_CFG);
  const db = getFirestore(app);

  const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
  const userCategory = userInfo.category || 'student';

  // 카테고리 정의
  const STUDENT_CATEGORIES = [
    { name: 'P-TECH 1학년', icon: '🎓' }, { name: 'P-TECH 2학년', icon: '🎓' },
    { name: '전문대 마케팅경영학과', icon: '📚' }, { name: '전문대 호텔조리학과', icon: '🍳' },
    { name: '전문대 회계세무학과', icon: '📊' }, { name: '전문대 호텔관광학과', icon: '🏨' },
    { name: '산업안전보건', icon: '🛡️' },
    { name: '공통', icon: '📢' },
  ];
  // 졸업생은 P-TECH 1/2학년 구분 없이 단일 P-TECH 카테고리 사용
  const GRADUATE_CATEGORIES = [
    { name: 'P-TECH', icon: '🎓' },
    { name: '전문대 마케팅경영학과', icon: '📚' }, { name: '전문대 호텔조리학과', icon: '🍳' },
    { name: '전문대 회계세무학과', icon: '📊' }, { name: '전문대 호텔관광학과', icon: '🏨' },
    { name: '공통', icon: '📢' },
  ];
  // 서브 카테고리 (학과 안의 분류)
  const SUB_CATEGORIES = [
    { name: '학습안내서', icon: '📘', desc: '학습 가이드' },
    { name: 'NCS 모듈', icon: '🎯', desc: '국가직무능력표준 자료' },
    { name: '기타 자료', icon: '📁', desc: '그 외 자료' }
  ];
  const COMPANY_CATEGORIES = [
    { name: '훈련 운영 서식', icon: '📋' },
    { name: '가이드 · 매뉴얼', icon: '📘' },
    { name: '공지 · 안내', icon: '📢' },
    { name: '산업안전보건', icon: '🛡️' },
  ];
  // 카테고리 선택: 전담인력 / 졸업생 / 재학생 (기본, 커뮤니티는 재학생과 동일)
  const CATEGORIES = userCategory === 'company' ? COMPANY_CATEGORIES
                   : userCategory === 'graduate' ? GRADUATE_CATEGORIES
                   : STUDENT_CATEGORIES;
  // 커뮤니티 체험 모드: 재학생 화면을 그대로 보여줌

  let allResources = [];

  // 카테고리별 헤더 색상 — 토스 톤에 맞춘 옅은 파스텔 배경
  if (userCategory === 'company') {
    document.getElementById('pageTitle').textContent = '전담인력 자료실';
    document.querySelector('.header').style.background = '#F5F3FF';
  }
  if (userCategory === 'prospect') {
    document.getElementById('pageTitle').textContent = '예비신입생 자료실';
    document.querySelector('.header').style.background = '#E6FAF3';
  }
  if (userCategory === 'graduate') {
    document.getElementById('pageTitle').textContent = '졸업생 자료실';
    document.querySelector('.header').style.background = '#FFF4E0';
  }
  if (userCategory === 'community') {
    document.getElementById('pageTitle').textContent = '🎤 체험 자료실';
    document.querySelector('.header').style.background = '#FCE9E1';
  }

  async function loadResources() {
    try {
      const q = query(collection(db, 'library'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      // 카테고리에 맞는 자료만 필터링
      // - 재학생/전담인력: 레거시 'all' 자료(과거 "전체" 옵션으로 등록된 것)도 함께 표시
      // - 졸업생/예비신입생: 신설 카테고리이므로 본인 target으로 명시된 자료만 표시 (레거시 'all' 제외)
      if (userCategory === 'company') {
        allResources = all.filter(r => r.target === 'company' || r.target === 'all');
      } else if (userCategory === 'prospect') {
        allResources = all.filter(r => r.target === 'prospect');
      } else if (userCategory === 'graduate') {
        allResources = all.filter(r => r.target === 'graduate');
      } else {
        // student + community (체험 모드는 재학생 자료를 그대로 봄)
        allResources = all.filter(r => r.target === 'student' || r.target === 'all');
      }

      // 예비신입생만 카테고리 생략 (단일 목록)
      // 졸업생은 재학생과 동일한 학과별 분류 사용
      if (userCategory === 'prospect') {
        showFlatList();
      } else {
        showCategories();
      }
    } catch(e) {
      console.error('자료실 로드 실패:', e);
      document.getElementById('categoryGrid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>자료를 불러올 수 없어요</div><button class="retry-btn" onclick="location.reload()">🔄 다시 시도</button></div>';
    }
  }

  // 졸업생/예비신입생 전용: 카테고리 없이 모든 자료 평면 목록
  function showFlatList() {
    document.getElementById('sectionTitle').textContent = '📚 자료 목록';
    document.getElementById('categoryGrid').style.display = 'none';
    const list = document.getElementById('fileList');
    list.style.display = 'flex';
    if (allResources.length === 0) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><div>등록된 자료가 없어요</div></div>';
      return;
    }
    renderFileList(allResources);
  }

  // 파일 카드 렌더러 (showFiles와 공용)
  function renderFileList(items) {
    const list = document.getElementById('fileList');
    list.innerHTML = items.map(r => {
      const isImage = r.fileType && r.fileType.startsWith('image/');
      const isPdf = (r.fileType && r.fileType.includes('pdf')) || (r.fileName && r.fileName.toLowerCase().endsWith('.pdf'));
      const iconClass = isImage ? 'image' : isPdf ? '' : 'doc';
      const icon = isImage ? '🖼️' : isPdf ? '📄' : '📁';
      const sizeMB = r.fileSize ? (r.fileSize / 1024 / 1024).toFixed(2) + 'MB' : '';
      const date = r.updatedAt ? new Date(r.updatedAt).toLocaleDateString('ko-KR') : '-';
      const viewerUrl = isPdf
        ? 'https://drive.google.com/viewerng/viewer?embedded=true&url=' + encodeURIComponent(r.fileUrl)
        : r.fileUrl;
      let actions = '';
      if (isPdf) {
        actions = '<a href="' + viewerUrl + '" target="_blank" class="btn-view">👁️ 보기</a>'
                + '<a href="' + r.fileUrl + '" download="' + (r.fileName || '파일') + '" target="_blank" class="btn-download">⬇️ 저장</a>';
      } else if (isImage) {
        actions = '<a href="' + r.fileUrl + '" target="_blank" class="btn-view">👁️ 보기</a>';
      } else {
        actions = '<a href="' + r.fileUrl + '" download="' + (r.fileName || '파일') + '" target="_blank" class="btn-download">⬇️ 다운로드</a>';
      }
      return '<div class="resource-card">'
           +   '<div class="file-icon ' + iconClass + '">' + icon + '</div>'
           +   '<div class="card-info">'
           +     '<div class="card-title">' + r.title + '</div>'
           +     (r.desc ? '<div class="card-desc">' + r.desc + '</div>' : '')
           +     '<div class="card-meta">' + date + (sizeMB ? ' · ' + sizeMB : '') + '</div>'
           +   '</div>'
           +   '<div class="card-actions">' + actions + '</div>'
           + '</div>';
    }).join('');
  }

  // 자료가 어느 서브 카테고리에 속하는지 판단
  function getSubCategory(resource) {
    if (resource.subCategory) return resource.subCategory;
    // 레거시: subCategory 없으면 desc/title로 추정
    const text = `${resource.title || ''} ${resource.desc || ''}`.toLowerCase();
    if (text.includes('ncs') || text.includes('능력단위')) return 'NCS 모듈';
    // subCategory 없는 옛 자료는 기본적으로 학습안내서로 분류 (NCS 외에는 대부분 학습안내서)
    return '학습안내서';
  }

  window.showCategories = function() {
    document.getElementById('backBtn').classList.remove('visible');
    document.getElementById('sectionTitle').textContent = '카테고리 선택';
    document.getElementById('fileList').style.display = 'none';
    document.getElementById('categoryGrid').style.display = 'grid';
    const searchEl = document.getElementById('resourceSearch');
    if (searchEl) { searchEl.style.display = 'none'; searchEl.value = ''; }
    window._currentCategory = null;
    window._currentSubCategory = null;
    document.getElementById('categoryGrid').innerHTML = CATEGORIES.map(cat => {
      const count = allResources.filter(r => r.category === cat.name).length;
      return `<div class="category-card" onclick="showSubCategories('${cat.name}')">
        <div class="category-icon">${cat.icon}</div>
        <div class="category-name">${cat.name}</div>
        <div class="category-count">자료 ${count}개</div>
      </div>`;
    }).join('');
  }

  // 학과 클릭 시 → 서브 카테고리 표시 (재학생/졸업생)
  window.showSubCategories = function(categoryName) {
    // 전담인력은 서브 카테고리 없이 바로 파일 목록
    if (userCategory === 'company') {
      window.showFiles(categoryName);
      return;
    }
    document.getElementById('backBtn').classList.add('visible');
    document.getElementById('backBtn').textContent = '← 학과 선택으로';
    document.getElementById('backBtn').setAttribute('onclick', 'showCategories()');
    document.getElementById('sectionTitle').textContent = categoryName;
    document.getElementById('fileList').style.display = 'none';
    document.getElementById('categoryGrid').style.display = 'grid';
    const searchEl = document.getElementById('resourceSearch');
    if (searchEl) { searchEl.style.display = 'none'; searchEl.value = ''; }
    window._currentCategory = categoryName;
    window._currentSubCategory = null;
    const categoryResources = allResources.filter(r => r.category === categoryName);
    // 서브 카테고리별 카운트
    document.getElementById('categoryGrid').innerHTML = SUB_CATEGORIES.map(sub => {
      const count = categoryResources.filter(r => getSubCategory(r) === sub.name).length;
      return `<div class="category-card" onclick="showFiles('${categoryName}', '${sub.name}')">
        <div class="category-icon">${sub.icon}</div>
        <div class="category-name">${sub.name}</div>
        <div class="category-count">${sub.desc} · ${count}개</div>
      </div>`;
    }).join('') + `<div class="category-card category-all" onclick="showFiles('${categoryName}', 'ALL')">
        <div class="category-icon">📂</div>
        <div class="category-name">전체 보기</div>
        <div class="category-count">모든 자료 (${categoryResources.length}개)</div>
      </div>`;
  };

  window.filterResources = function() {
    if (window._currentCategory) window.showFiles(window._currentCategory, window._currentSubCategory);
  };

  window.showFiles = function(categoryName, subCategory) {
    document.getElementById('backBtn').classList.add('visible');
    // 재학생: 학과 → 서브 카테고리 → 파일 (3단계)
    // 전담인력: 카테고리 → 파일 (2단계)
    if (subCategory && userCategory !== 'company') {
      document.getElementById('backBtn').textContent = '← ' + categoryName;
      document.getElementById('backBtn').setAttribute('onclick', `showSubCategories('${categoryName}')`);
      const subDisplay = subCategory === 'ALL' ? '전체 보기' : subCategory;
      document.getElementById('sectionTitle').textContent = `${categoryName} · ${subDisplay}`;
    } else {
      document.getElementById('backBtn').textContent = '← 카테고리로 돌아가기';
      document.getElementById('backBtn').setAttribute('onclick', 'showCategories()');
      document.getElementById('sectionTitle').textContent = categoryName;
    }
    document.getElementById('categoryGrid').style.display = 'none';
    document.getElementById('fileList').style.display = 'flex';
    const searchEl = document.getElementById('resourceSearch');
    if (searchEl) searchEl.style.display = 'block';
    window._currentCategory = categoryName;
    window._currentSubCategory = subCategory;
    const searchTerm = (searchEl?.value || '').trim().toLowerCase();

    let filtered = allResources.filter(r => r.category === categoryName);
    // 서브 카테고리 필터 (재학생만, ALL이면 필터 안 함)
    if (subCategory && subCategory !== 'ALL' && userCategory !== 'company') {
      filtered = filtered.filter(r => getSubCategory(r) === subCategory);
    }
    if (searchTerm) {
      filtered = filtered.filter(r => {
        const hay = `${r.title || ''} ${r.desc || ''} ${r.fileName || ''}`.toLowerCase();
        return hay.includes(searchTerm);
      });
    }
    const list = document.getElementById('fileList');

    if (filtered.length === 0) {
      const msg = searchTerm ? `🔍 "${searchTerm}" 검색 결과 없음` : '등록된 자료가 없어요';
      list.innerHTML = `<div class="empty"><div class="empty-icon">📂</div><div>${msg}</div></div>`;
      return;
    }

    list.innerHTML = filtered.map(r => {
      const isImage = r.fileType?.startsWith('image/');
      const isPdf = r.fileType?.includes('pdf') || r.fileName?.toLowerCase().endsWith('.pdf');
      const iconClass = isImage ? 'image' : isPdf ? '' : 'doc';
      const icon = isImage ? '🖼️' : isPdf ? '📄' : '📁';
      const sizeMB = r.fileSize ? (r.fileSize / 1024 / 1024).toFixed(2) + 'MB' : '';
      const date = r.updatedAt ? new Date(r.updatedAt).toLocaleDateString('ko-KR') : '-';
      const targetBadge = r.target === 'company'
        ? '<span class="target-badge company">전담인력</span>'
        : r.target === 'student' ? '<span class="target-badge student">재학생</span>'
        : r.target === 'all' ? '<span class="target-badge shared">🛡️ 공유</span>' : '';

      return `<div class="resource-card">
        <div class="file-icon ${iconClass}">${icon}</div>
        <div class="card-info">
          <div class="card-title">${r.title}${targetBadge}</div>
          ${r.desc ? `<div class="card-desc">${r.desc}</div>` : ''}
          <div class="card-meta">${date}${sizeMB ? ' · ' + sizeMB : ''}</div>
        </div>
        <div class="card-actions">
          ${(function(){
            const isPdf = r.fileType?.includes('pdf') || r.fileName?.toLowerCase().endsWith('.pdf');
            const isImage = r.fileType?.startsWith('image/');
            const viewerUrl = isPdf
              ? 'https://drive.google.com/viewerng/viewer?embedded=true&url=' + encodeURIComponent(r.fileUrl)
              : r.fileUrl;
            if (isPdf) {
              return '<a href="' + viewerUrl + '" target="_blank" class="btn-view">👁️ 보기</a>' +
                     '<a href="' + r.fileUrl + '" download="' + (r.fileName || '파일') + '" target="_blank" class="btn-download">⬇️ 저장</a>';
            } else if (isImage) {
              return '<a href="' + r.fileUrl + '" target="_blank" class="btn-view">👁️ 보기</a>';
            } else {
              return '<a href="' + r.fileUrl + '" download="' + (r.fileName || '파일') + '" target="_blank" class="btn-download">⬇️ 다운로드</a>';
            }
          })()}
        </div>
      </div>`;
    }).join('');
  }

  loadResources();
</script>
</body>
</html>
