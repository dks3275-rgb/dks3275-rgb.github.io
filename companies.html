<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습기업 디렉토리 - AU 일학습병행</title>
<meta name="theme-color" content="#2196f3">
<script src="device-check.js" data-auto-block></script>
<script src="dark-mode.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  :root { --navy: #1976d2; --blue: #2196f3; --accent: #e8a020; --light: #f0f4f8; --gray: #8a9ab5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--light); min-height: 100vh; }
  .header { background: var(--blue); padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  .back-btn { background: rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 10px; font-size: 18px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }
  .header-badge { background: var(--accent); color: white; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .header h1 { color: white; font-size: 18px; font-weight: 700; }
  .container { max-width: 700px; margin: 0 auto; padding: 24px 16px 80px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .search-input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid #e4eaf4; border-radius: 10px; font-size: 14px; box-sizing: border-box; background: white; font-family: inherit; }
  .filter-select { padding: 10px 12px; border: 1.5px solid #e4eaf4; border-radius: 10px; font-size: 13px; background: white; font-family: inherit; }
  .company-card { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 2px 8px rgba(33,150,243,0.08); margin-bottom: 12px; border-left: 4px solid var(--blue); }
  .company-name { font-size: 16px; font-weight: 700; color: #1a202c; margin-bottom: 4px; }
  .company-dept { font-size: 12px; color: var(--gray); margin-bottom: 8px; }
  .company-info { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; color: #4a5568; }
  .company-info .label { color: var(--gray); font-weight: 500; }
  .empty { text-align: center; padding: 60px 20px; color: var(--gray); }
  .info-box { background: #e3f2fd; padding: 12px 16px; border-radius: 10px; font-size: 13px; color: #0d47a1; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="back-btn" aria-label="홈으로">←</a>
  <div class="header-badge">디렉토리</div>
  <h1>학습기업 디렉토리</h1>
</div>
<div class="container">
  <div class="info-box">
    🏢 일학습병행 협약 학습기업 정보입니다. 졸업생/전담인력 네트워크에 활용해주세요.
  </div>
  <div class="toolbar">
    <input type="text" class="search-input" id="search" placeholder="🔍 회사명·학과 검색..." oninput="renderCompanies()">
    <select class="filter-select" id="deptFilter" onchange="renderCompanies()">
      <option value="all">📋 전체 학과</option>
      <option value="P-TECH 1학년">P-TECH 1학년</option>
      <option value="P-TECH 2학년">P-TECH 2학년</option>
      <option value="전문대 마케팅경영학과">마케팅경영학과</option>
      <option value="전문대 호텔조리학과">호텔조리학과</option>
      <option value="전문대 회계세무학과">회계세무학과</option>
      <option value="전문대 호텔관광학과">호텔관광학과</option>
    </select>
  </div>
  <div id="list"><div class="empty">불러오는 중...</div></div>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  const firebaseConfig = { apiKey:"AIzaSyD6r6R593RIfe8GCMjM3lgQgCcfiF0Rbuc", authDomain:"au-ilhaksub.firebaseapp.com", projectId:"au-ilhaksub", storageBucket:"au-ilhaksub.firebasestorage.app", messagingSenderId:"407960160823", appId:"1:407960160823:web:1e830d6b0d69e4a7b84db2" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let companies = [];
  async function load() {
    try {
      // 학습기업 정보는 users 컬렉션의 company 카테고리 + 별도 companies 컬렉션 결합
      const [companiesSnap, usersSnap] = await Promise.all([
        getDocs(collection(db, 'companies')).catch(() => ({ docs: [] })),
        getDocs(collection(db, 'users'))
      ]);
      // companies 컬렉션 우선
      const direct = companiesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      // users의 company 카테고리에서 회사명 정보 추출 (중복 제거)
      const fromUsers = {};
      usersSnap.docs.forEach(d => {
        const u = d.data();
        if (u.category === 'company' && u.firm) {
          if (!fromUsers[u.firm]) {
            fromUsers[u.firm] = {
              id: 'u_' + d.id,
              name: u.firm,
              dept: u.studentDept || u.dept || '',
              role: u.role || '전담인력',
              contact: u.role ? u.name + ' (' + u.role + ')' : '',
              source: 'users'
            };
          }
        }
      });
      companies = [...direct, ...Object.values(fromUsers)];
      renderCompanies();
    } catch(e) {
      document.getElementById('list').innerHTML = '<div class="empty">⚠️ 불러오기 실패: ' + e.message + '</div>';
    }
  }
  window.renderCompanies = function() {
    const search = (document.getElementById('search')?.value || '').trim().toLowerCase();
    const dept = document.getElementById('deptFilter')?.value || 'all';
    let items = companies.slice();
    if (dept !== 'all') items = items.filter(c => (c.dept || '').includes(dept) || (c.studentDept || '').includes(dept));
    if (search) {
      items = items.filter(c => {
        const hay = `${c.name || ''} ${c.dept || ''} ${c.contact || ''}`.toLowerCase();
        return hay.includes(search);
      });
    }
    if (items.length === 0) {
      const msg = search ? `🔍 "${search}" 검색 결과 없음` : '📭 등록된 학습기업이 없어요';
      document.getElementById('list').innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }
    items.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
    document.getElementById('list').innerHTML = items.map(c => `
      <div class="company-card">
        <div class="company-name">🏢 ${c.name || '-'}</div>
        ${c.dept ? `<div class="company-dept">관련 학과: ${c.dept}</div>` : ''}
        <div class="company-info">
          ${c.contact ? `<span class="label">담당자</span><span>${c.contact}</span>` : ''}
          ${c.role && !c.contact ? `<span class="label">직책</span><span>${c.role}</span>` : ''}
          ${c.address ? `<span class="label">주소</span><span>${c.address}</span>` : ''}
          ${c.phone ? `<span class="label">연락처</span><span>${c.phone}</span>` : ''}
          ${c.field ? `<span class="label">분야</span><span>${c.field}</span>` : ''}
        </div>
      </div>`).join('');
  };
  load();
</script>
</body>
</html>
