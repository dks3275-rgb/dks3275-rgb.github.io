<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>익명 의견함 - AU 일학습병행</title>
<meta name="theme-color" content="#FFFFFF">
<script src="device-check.js" data-auto-block></script>
<script src="dark-mode.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  :root {
    --tk-bg: #F2F4F6; --tk-surface: #FFFFFF; --tk-text: #191F28; --tk-text-sub: #4E5968; --tk-text-muted: #8B95A1;
    --tk-border: #E5E8EB; --tk-border-strong: #D1D6DB;
    --tk-primary: #3182F6; --tk-primary-dark: #1B64DA; --tk-primary-soft: #E8F2FF;
    --tk-success: #00C896; --tk-danger: #F04452;
    --tk-radius: 14px; --tk-radius-lg: 20px;
    --navy: var(--tk-primary-dark); --blue: var(--tk-primary); --accent: #FF9F1C; --light: var(--tk-bg); --gray: var(--tk-text-muted);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--tk-bg); min-height: 100vh; color: var(--tk-text); -webkit-font-smoothing: antialiased; letter-spacing: -0.2px; }
  .header { background: var(--tk-surface); padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--tk-border); }
  .back-btn { background: var(--tk-bg); color: var(--tk-text); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; font-weight: 600; transition: background 0.15s; }
  .back-btn:hover { background: var(--tk-border); }
  .header-badge { background: var(--tk-primary-soft); color: var(--tk-primary); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; letter-spacing: -0.2px; }
  .header h1 { color: var(--tk-text); font-size: 16px; font-weight: 700; letter-spacing: -0.4px; }
  .container { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }
  .info-box { background: var(--tk-primary-soft); padding: 14px 18px; border-radius: var(--tk-radius); margin-bottom: 16px; font-size: 13px; line-height: 1.6; color: var(--tk-primary-dark); }
  .info-box strong { display: block; margin-bottom: 4px; }
  .form-card { background: var(--tk-surface); border: 1px solid var(--tk-border); border-radius: var(--tk-radius-lg); padding: 22px; }
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--tk-text); margin-bottom: 8px; display: block; letter-spacing: -0.2px; }
  .form-input { width: 100%; padding: 13px 14px; border: 1px solid var(--tk-bg); border-radius: var(--tk-radius); font-size: 14px; font-family: inherit; box-sizing: border-box; background: var(--tk-bg); color: var(--tk-text); outline: none; transition: all 0.15s; }
  .form-input:focus { border-color: var(--tk-primary); background: var(--tk-surface); box-shadow: 0 0 0 3px rgba(49,130,246,0.1); }
  textarea.form-input { resize: vertical; min-height: 140px; line-height: 1.55; }
  .category-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat-btn { padding: 12px; border: 1px solid var(--tk-bg); border-radius: var(--tk-radius); background: var(--tk-bg); color: var(--tk-text-sub); cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; transition: all 0.15s; }
  .cat-btn:hover { background: var(--tk-primary-soft); color: var(--tk-primary); }
  .cat-btn.selected { background: var(--tk-primary); color: white; border-color: var(--tk-primary); font-weight: 700; }
  .submit-btn { width: 100%; background: var(--tk-primary); color: white; border: none; padding: 15px; border-radius: var(--tk-radius); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: -0.3px; transition: background 0.15s; }
  .submit-btn:hover:not(:disabled) { background: var(--tk-primary-dark); }
  .submit-btn:active:not(:disabled) { transform: scale(0.99); }
  .submit-btn:disabled { background: var(--tk-text-muted); cursor: not-allowed; }
  .result-msg { margin-top: 14px; padding: 12px; border-radius: var(--tk-radius); font-size: 13px; text-align: center; display: none; font-weight: 600; }
  .result-msg.success { background: #DEFCEF; color: #007A5C; display: block; }
  .result-msg.error { background: #FEE6E8; color: #C7242E; display: block; }
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="back-btn" aria-label="홈으로">←</a>
  <div class="header-badge">의견함</div>
  <h1>익명 의견함</h1>
</div>
<div class="container">
  <div class="info-box">
    <strong>🔒 완전 익명 보장</strong>
    이름·학과·연락처 등 어떤 개인정보도 수집하지 않습니다. 솔직한 의견을 남겨주세요.
    운영진이 검토 후 개선에 반영합니다.
  </div>

  <div class="form-card">
    <div class="form-group">
      <label class="form-label">분류</label>
      <div class="category-buttons">
        <button class="cat-btn selected" data-cat="suggestion" type="button">💡 건의/제안</button>
        <button class="cat-btn" data-cat="complaint" type="button">😐 불편/개선</button>
        <button class="cat-btn" data-cat="praise" type="button">👏 칭찬/격려</button>
        <button class="cat-btn" data-cat="other" type="button">📝 기타</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">제목</label>
      <input type="text" class="form-input" id="title" placeholder="간단한 제목" maxlength="60">
    </div>
    <div class="form-group">
      <label class="form-label">의견 내용</label>
      <textarea class="form-input" id="content" placeholder="자유롭게 작성해주세요. 익명으로 전달됩니다." maxlength="2000"></textarea>
    </div>
    <button class="submit-btn" id="submitBtn">📨 의견 보내기</button>
    <div class="result-msg" id="resultMsg"></div>
  </div>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  const firebaseConfig = { apiKey:"AIzaSyD6r6R593RIfe8GCMjM3lgQgCcfiF0Rbuc", authDomain:"au-ilhaksub.firebaseapp.com", projectId:"au-ilhaksub", storageBucket:"au-ilhaksub.firebasestorage.app", messagingSenderId:"407960160823", appId:"1:407960160823:web:1e830d6b0d69e4a7b84db2" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let selectedCat = 'suggestion';
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selectedCat = b.dataset.cat;
    };
  });

  document.getElementById('submitBtn').onclick = async () => {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const result = document.getElementById('resultMsg');
    const btn = document.getElementById('submitBtn');
    if (!content) { result.className = 'result-msg error'; result.textContent = '⚠️ 의견 내용을 입력해주세요.'; return; }
    btn.disabled = true; btn.textContent = '전송 중...';
    try {
      // 절대 사용자 식별 정보를 저장하지 않음 (deviceId, oneSignalId 등 X)
      await addDoc(collection(db, 'feedback'), {
        title: title || '(제목 없음)',
        content,
        category: selectedCat,
        status: 'new',
        createdAt: serverTimestamp()
      });
      // 관리자에게 알림 (식별정보 없음)
      try {
        const WORKER_URL = 'https://damp-leaf-0c5c.dks3275.workers.dev';
        await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            app_id: '6bed6730-b167-48a8-a98d-83cdcb1cbc10',
            filters: [
              { field: 'tag', key: 'role', relation: '=', value: 'admin' },
              { operator: 'OR' },
              { field: 'tag', key: '역할', relation: '=', value: '관리자' }
            ],
            contents: { ko: '새 익명 의견이 도착했어요', en: 'New anonymous feedback' },
            headings: { ko: '📨 익명 의견함', en: 'Anonymous Feedback' }
          })
        });
      } catch(e) { console.warn('알림 발송 실패:', e); }
      result.className = 'result-msg success';
      result.innerHTML = '✅ 의견이 전송됐어요. 소중한 의견 감사합니다!';
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
    } catch(e) {
      result.className = 'result-msg error';
      result.textContent = '❌ 전송 실패: ' + e.message;
    }
    btn.disabled = false; btn.textContent = '📨 의견 보내기';
  };
</script>
<!-- 알림 종 위젯 -->
<script type="module" src="./js/notification-bell.js"></script>
</body>
</html>
