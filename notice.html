<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AU 공지사항</title>
<script src="device-check.js" data-auto-block></script>
<script src="dark-mode.js"></script>
<meta name="theme-color" content="#FFFFFF" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  /* 토스 디자인 토큰 */
  :root {
    --tk-bg: #F2F4F6; --tk-surface: #FFFFFF; --tk-surface-alt: #F9FAFB;
    --tk-text: #191F28; --tk-text-sub: #4E5968; --tk-text-muted: #8B95A1;
    --tk-border: #E5E8EB; --tk-border-strong: #D1D6DB;
    --tk-primary: #3182F6; --tk-primary-dark: #1B64DA; --tk-primary-soft: #E8F2FF;
    --tk-success: #00C896; --tk-warning: #FF9F1C; --tk-danger: #F04452;
    --tk-radius: 14px; --tk-radius-lg: 20px;
    --tk-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --tk-shadow: 0 2px 8px rgba(0,0,0,0.06);
    /* 레거시 호환 */
    --navy: var(--tk-primary-dark); --blue: var(--tk-primary); --accent: var(--tk-warning);
    --light: var(--tk-bg); --gray: var(--tk-text-muted);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--tk-bg); min-height: 100vh; color: var(--tk-text); -webkit-font-smoothing: antialiased; letter-spacing: -0.2px; }
  .header { background: var(--tk-surface); padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--tk-border); }
  .back-btn { background: var(--tk-bg); color: var(--tk-text); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; transition: background 0.15s; font-weight: 600; }
  .back-btn:hover { background: var(--tk-border); }
  .back-btn:active { transform: scale(0.95); }
  .header-badge { background: var(--tk-primary-soft); color: var(--tk-primary); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; letter-spacing: -0.2px; }
  .header h1 { color: var(--tk-text); font-size: 16px; font-weight: 700; letter-spacing: -0.4px; }
  .retry-btn { margin-top: 16px; background: var(--tk-primary); color: white; border: none; border-radius: var(--tk-radius); padding: 12px 22px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: -0.3px; }
  .retry-btn:hover { background: var(--tk-primary-dark); }
  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px 40px; }
  .notice-list { display: flex; flex-direction: column; gap: 10px; }
  .notice-card { background: var(--tk-surface); border-radius: var(--tk-radius-lg); padding: 18px 20px; cursor: pointer; transition: all 0.15s; border: 1px solid var(--tk-border); }
  .notice-card:hover { border-color: var(--tk-border-strong); transform: translateY(-1px); box-shadow: var(--tk-shadow); }
  .notice-card:active { transform: translateY(0); }
  .notice-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .notice-badge { background: var(--tk-primary-soft); color: var(--tk-primary); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; letter-spacing: -0.2px; }
  .notice-date { font-size: 11.5px; color: var(--tk-text-muted); margin-left: auto; }
  .notice-title { font-size: 16px; font-weight: 700; color: var(--tk-text); margin-bottom: 6px; letter-spacing: -0.4px; line-height: 1.4; }
  .notice-preview { font-size: 13.5px; color: var(--tk-text-sub); line-height: 1.55; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .notice-detail { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--tk-border); }
  .notice-detail.open { display: block; }
  .notice-content { font-size: 14px; line-height: 1.75; color: var(--tk-text); white-space: pre-wrap; }
  .notice-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 16px; }
  .notice-images img { width: 100%; border-radius: 12px; cursor: pointer; }
  .notice-files { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .notice-file { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--tk-bg); border-radius: 10px; text-decoration: none; color: var(--tk-primary); font-size: 13px; font-weight: 600; transition: background 0.15s; }
  .notice-file:hover { background: var(--tk-primary-soft); }
  .empty { text-align: center; padding: 60px 20px; color: var(--tk-text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--tk-text-muted); }
  /* 검색·필터 input (인라인 스타일 제거 후 통합) */
  .notice-search-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .notice-search-input { flex: 1; min-width: 200px; padding: 12px 14px; border: 1px solid var(--tk-border); border-radius: var(--tk-radius); font-size: 14px; background: var(--tk-surface); outline: none; transition: all 0.15s; font-family: inherit; color: var(--tk-text); }
  .notice-search-input:focus { border-color: var(--tk-primary); box-shadow: 0 0 0 3px rgba(49,130,246,0.1); }
  .notice-filter-select { padding: 12px; border: 1px solid var(--tk-border); border-radius: var(--tk-radius); font-size: 13px; background: var(--tk-surface); cursor: pointer; font-family: inherit; color: var(--tk-text); outline: none; }
  .notice-filter-select:focus { border-color: var(--tk-primary); }
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="back-btn" aria-label="홈으로">←</a>
  <div class="header-badge">공지사항</div>
  <h1>AU 일학습병행 공지사항</h1>
</div>
<div class="container">
  <div class="notice-search-row">
    <input type="text" id="noticeSearch" placeholder="🔍 제목·내용 검색..." class="notice-search-input" oninput="filterNotices()">
    <select id="noticeFilterSelect" onchange="filterNotices()" class="notice-filter-select">
      <option value="all">📢 전체</option>
      <option value="favorite">⭐ 즐겨찾기</option>
    </select>
  </div>
  <div class="notice-list" id="noticeList">
    <div class="loading">공지사항을 불러오는 중...</div>
  </div>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, orderBy, query, doc, updateDoc, increment, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  const firebaseConfig = { apiKey:"AIzaSyD6r6R593RIfe8GCMjM3lgQgCcfiF0Rbuc", authDomain:"au-ilhaksub.firebaseapp.com", projectId:"au-ilhaksub", storageBucket:"au-ilhaksub.firebasestorage.app", messagingSenderId:"407960160823", appId:"1:407960160823:web:1e830d6b0d69e4a7b84db2" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  // 사용자 카테고리 확인 (재학생=student, 전담인력=company, 기타=all)
  const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
  const userCategory = userInfo.category || 'all';

  // ── 읽음 처리 ──
  // 공지 상세를 처음 펼칠 때 readBy에 내 deviceId 기록 + 조회수 증가
  // (deviceId 없으면 = 미가입 상태 → 기록하지 않음)
  const READ_KEY = 'noticeReadLocal';
  function getLocalRead() {
    try { return JSON.parse(localStorage.getItem(READ_KEY) || '[]'); } catch { return []; }
  }
  async function markNoticeRead(noticeId) {
    const myDeviceId = localStorage.getItem('deviceId');
    if (!myDeviceId) return;                      // 미가입자는 집계 제외
    const localRead = getLocalRead();
    if (localRead.includes(noticeId)) return;     // 이미 기록함 → 중복 쓰기 방지
    localRead.push(noticeId);
    localStorage.setItem(READ_KEY, JSON.stringify(localRead));
    try {
      await updateDoc(doc(db, 'notices', noticeId), {
        readBy: arrayUnion(myDeviceId),
        viewCount: increment(1)
      });
    } catch(e) {
      console.warn('읽음 기록 실패:', e);
      // 실패 시 로컬 기록 되돌려 다음에 재시도
      const rollback = getLocalRead().filter(id => id !== noticeId);
      localStorage.setItem(READ_KEY, JSON.stringify(rollback));
    }
  }

  // 즐겨찾기 (localStorage)
  const FAV_KEY = 'noticeFavorites';
  function getFavorites() {
    try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch { return []; }
  }
  function isFavorite(id) { return getFavorites().includes(id); }
  function toggleFavorite(id, ev) {
    if (ev) { ev.stopPropagation(); }
    const favs = getFavorites();
    const idx = favs.indexOf(id);
    if (idx === -1) favs.push(id); else favs.splice(idx, 1);
    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    window.filterNotices();
  }
  window.toggleFavorite = toggleFavorite;

  let allNotices = [];
  async function loadNotices() {
    const list = document.getElementById('noticeList');
    try {
      const q = query(collection(db, 'notices'), orderBy('createdAt', 'desc'));
      const snapshot = await getDocs(q);
      if (snapshot.empty) { list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>등록된 공지사항이 없어요</div></div>'; return; }

      // 카테고리 + 학과/학년(subTarget) 매칭
      const allDocs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      // 사용자 학과/학년 키
      const userSubKey = userCategory === 'student' ? (userInfo.grade || '')
                       : userCategory === 'graduate' ? (userInfo.dept || '')
                       : userCategory === 'prospect' ? (userInfo.interest || '')
                       : '';
      allNotices = allDocs.filter(d => {
        const t = d.target || 'all';
        // 1차: 카테고리
        const targetOk = t === 'all' || t === userCategory;
        if (!targetOk) return false;
        // 2차: subTarget (비어있으면 카테고리 전체 통과)
        const sub = Array.isArray(d.subTarget) ? d.subTarget : [];
        if (sub.length === 0) return true;
        if (userCategory === 'company') return true; // 전담인력은 학과 매칭 안 함
        return userSubKey && sub.includes(userSubKey);
      });
      // 핀 고정 우선 정렬
      allNotices.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return 0;
      });
      filterNotices();
    } catch(e) {
      console.error('공지 로드 실패:', e);
      list.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>공지사항을 불러올 수 없어요</div><button class="retry-btn" onclick="location.reload()">🔄 다시 시도</button></div>';
    }
  }
  function filterNotices() {
    const list = document.getElementById('noticeList');
    const searchTerm = (document.getElementById('noticeSearch')?.value || '').trim().toLowerCase();
    const filterMode = document.getElementById('noticeFilterSelect')?.value || 'all';
    const favs = getFavorites();
    const localRead = getLocalRead();
    let items = allNotices.slice();
    if (filterMode === 'favorite') items = items.filter(d => favs.includes(d.id));
    if (searchTerm) {
      items = items.filter(d => {
        const hay = `${d.title || ''} ${d.content || ''}`.toLowerCase();
        return hay.includes(searchTerm);
      });
    }
    if (items.length === 0) {
      const msg = filterMode === 'favorite' ? '⭐ 즐겨찾기한 공지가 없어요' : (searchTerm ? `🔍 "${searchTerm}" 검색 결과 없음` : '📭 등록된 공지사항이 없어요');
      list.innerHTML = `<div class="empty"><div class="empty-icon">${filterMode === 'favorite' ? '⭐' : '📭'}</div><div>${msg}</div></div>`;
      return;
    }
    list.innerHTML = '';
    items.forEach(d => {
      const date = d.createdAt ? new Date(d.createdAt.seconds * 1000).toLocaleDateString('ko-KR') : '';
      const targetBadge = d.target === 'company' ? '<span style="font-size:10px;background:#ede9fe;color:#5b21b6;padding:2px 6px;border-radius:5px;margin-left:4px;font-weight:700;">전담인력</span>'
        : d.target === 'student' ? '<span style="font-size:10px;background:#e3f2fd;color:#1565c0;padding:2px 6px;border-radius:5px;margin-left:4px;font-weight:700;">재학생</span>'
        : d.target === 'graduate' ? '<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:5px;margin-left:4px;font-weight:700;">졸업생</span>'
        : d.target === 'prospect' ? '<span style="font-size:10px;background:#d1fae5;color:#065f46;padding:2px 6px;border-radius:5px;margin-left:4px;font-weight:700;">예비신입생</span>' : '';
      const pinnedBadge = d.pinned ? '<span style="font-size:10px;background:#fee2e2;color:#991b1b;padding:2px 6px;border-radius:5px;margin-left:4px;font-weight:700;">📌 고정</span>' : '';
      // 안 읽은 공지 표시
      const unreadBadge = localRead.includes(d.id) ? '' : `<span id="unread-${d.id}" style="font-size:10px;background:#2196f3;color:white;padding:2px 7px;border-radius:5px;margin-left:4px;font-weight:700;">안 읽음</span>`;
      const isFav = favs.includes(d.id);
      const favStar = `<span onclick="toggleFavorite('${d.id}', event)" style="cursor:pointer;font-size:18px;margin-left:auto;user-select:none;color:${isFav ? '#f59e0b' : '#cbd5e0'};" title="${isFav ? '즐겨찾기 해제' : '즐겨찾기'}">${isFav ? '⭐' : '☆'}</span>`;
      // 반응 (이모지 카운터)
      const reactions = d.reactions || {};
      const myReact = JSON.parse(localStorage.getItem('noticeReactions_' + d.id) || 'null');
      const reactionEmojis = ['👍', '❤️', '😊', '👏', '🙏'];
      const reactionBar = `<div style="display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0;flex-wrap:wrap;" onclick="event.stopPropagation()">
        ${reactionEmojis.map(em => {
          const count = reactions[em] || 0;
          const active = myReact === em;
          return `<button onclick="reactNotice('${d.id}', '${em}', event)" style="cursor:pointer;background:${active ? '#e3f2fd' : 'white'};border:1.5px solid ${active ? '#2196f3' : '#e4eaf4'};border-radius:20px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:4px;font-family:inherit;">${em} <span style="font-weight:600;color:#718096;font-size:12px;">${count}</span></button>`;
        }).join('')}
      </div>`;
      const card = document.createElement('div');
      card.className = 'notice-card';
      if (d.pinned) card.style.borderColor = '#fca5a5';
      card.innerHTML = `<div class="notice-top"><span class="notice-badge">공지</span>${pinnedBadge}${unreadBadge}${targetBadge}<span class="notice-date">${date}</span>${favStar}</div><div class="notice-title">${d.title}</div><div class="notice-preview">${d.content}</div><div class="notice-detail" id="detail-${d.id}"><div class="notice-content">${d.content}</div>${d.images && d.images.length > 0 ? `<div class="notice-images">${d.images.map(url => `<img src="${url}" onclick="window.open('${url}')">`).join('')}</div>` : ''}${d.files && d.files.length > 0 ? `<div class="notice-files">${d.files.map(f => `<a class="notice-file" href="${f.url}" target="_blank">📎 ${f.name}</a>`).join('')}</div>` : ''}${reactionBar}</div>`;
      card.onclick = (ev) => {
        if (ev.target.tagName === 'IMG' || ev.target.tagName === 'A' || ev.target.onclick) return;
        const det = document.getElementById('detail-' + d.id);
        det.classList.toggle('open');
        if (det.classList.contains('open')) {
          markNoticeRead(d.id);                                    // 펼칠 때만 읽음 기록
          const ub = document.getElementById('unread-' + d.id);
          if (ub) ub.remove();
        }
      };
      list.appendChild(card);
    });
  }
  window.filterNotices = filterNotices;

  // 반응 토글 (이모지)
  window.reactNotice = async function(noticeId, emoji, ev) {
    if (ev) ev.stopPropagation();
    try {
      const key = 'noticeReactions_' + noticeId;
      const prev = JSON.parse(localStorage.getItem(key) || 'null');
      const ref = doc(db, 'notices', noticeId);
      // 이전 반응이 있으면 -1, 새 반응 +1 (같은 거 또 누르면 취소)
      const updates = {};
      if (prev === emoji) {
        // 같은 반응 → 취소
        updates['reactions.' + emoji] = increment(-1);
        localStorage.removeItem(key);
        const item = allNotices.find(n => n.id === noticeId);
        if (item) {
          item.reactions = item.reactions || {};
          item.reactions[emoji] = Math.max(0, (item.reactions[emoji] || 0) - 1);
        }
      } else {
        // 새/다른 반응
        if (prev) updates['reactions.' + prev] = increment(-1);
        updates['reactions.' + emoji] = increment(1);
        localStorage.setItem(key, JSON.stringify(emoji));
        const item = allNotices.find(n => n.id === noticeId);
        if (item) {
          item.reactions = item.reactions || {};
          if (prev) item.reactions[prev] = Math.max(0, (item.reactions[prev] || 0) - 1);
          item.reactions[emoji] = (item.reactions[emoji] || 0) + 1;
        }
      }
      await updateDoc(ref, updates);
      filterNotices();
      // 디테일이 열려있던 카드 다시 열기
      setTimeout(() => {
        const det = document.getElementById('detail-' + noticeId);
        if (det) det.classList.add('open');
      }, 50);
    } catch(e) { console.warn('반응 실패:', e); }
  };

  loadNotices();
</script>
<!-- 알림 종 위젯 -->
<script type="module" src="./js/notification-bell.js"></script>
</body>
</html>
