name: Daily Firestore Backup

on:
  schedule:
    # 매일 한국시간 새벽 3시 = UTC 18:00
    - cron: '0 18 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Setup service account
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          mkdir -p .secrets
          echo "$FIREBASE_SA_JSON" > .secrets/sa.json

      - name: Run backup
        run: node backup.js

      - name: Cleanup credentials
        if: always()
        run: rm -rf .secrets

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # backups 폴더에 변경사항이 있을 때만 커밋
          git add backups/
          if git diff --staged --quiet; then
            echo "No backup changes"
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "🗄️ Auto backup $DATE"
            git push
          fi

      - name: Cleanup old backups (30+ days)
        run: |
          find backups -name "*.json" -mtime +30 -delete 2>/dev/null || true
          if [ -d backups ] && [ "$(find backups -name '*.json' 2>/dev/null | wc -l)" != "$(find backups -name '*.json' -mtime -30 2>/dev/null | wc -l)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backups/
            if ! git diff --staged --quiet; then
              git commit -m "🧹 Cleanup old backups (30+ days)"
              git push
            fi
          fi
